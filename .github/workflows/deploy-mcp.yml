name: Deploy MCP HTTP

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mcp/**'
      - '.github/workflows/deploy-mcp.yml'
      - '.github/scripts/deploy-mcp.sh'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Otherwise git sends this run's GITHUB_TOKEN instead of DEPLOY_REPO_TOKEN, and the deploy repo looks missing.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build HTTP
        run: pnpm --filter @qnx/mcp run build:http

      - name: Push to deployment repo
        run: bash .github/scripts/deploy-mcp.sh
        env:
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
